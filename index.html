<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html,body,#app{width:100%;height:100%;margin:0;background:#f5f6f8}
      @media (prefers-color-scheme:dark){html:not([data-theme]),html:not([data-theme]) body,html:not([data-theme]) #app{background:#0f1012}}
      html[data-theme="light"],html[data-theme="light"] body,html[data-theme="light"] #app{background:#f5f6f8}
      html[data-theme="dark"],html[data-theme="dark"] body,html[data-theme="dark"] #app{background:#0f1012}
    </style>
    <script type="module" src="/src/preload-theme.ts"></script>
    <title>oneView</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
